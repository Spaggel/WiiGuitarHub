name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases for tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build WiiHub.sln -c Release

      - name: Publish (single self-contained exe)
        run: >
          dotnet publish src/WiiHub.App/WiiHub.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md publish/
          Compress-Archive -Path publish/* -DestinationPath WiiGuitarHub-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WiiGuitarHub-win-x64
          path: WiiGuitarHub-win-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WiiGuitarHub-win-x64.zip
          generate_release_notes: true
